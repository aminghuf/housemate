services:
  bot:
    # Both `image` and `build` are set: locally, `docker compose up --build`
    # builds and tags this image; on the VPS (no source/Dockerfile present),
    # `docker compose pull` fetches the same tag from Docker Hub instead.
    image: aminghazizadeh/housematebot:latest
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Always /data inside the container, regardless of what DB_PATH is
      # set to in .env for local (non-Docker) dev.
      - DB_PATH=/data/housemate.db
    volumes:
      - housemate_data:/data

volumes:
  housemate_data:
