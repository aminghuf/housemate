name: Build, push, and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: aminghazizadeh/housematebot

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Settings() validates at import time; tests never send real
      # Telegram traffic, so these just need to be well-formed, not real.
      BOT_TOKEN: "test-token"
      HOUSE_CHANNEL_ID: "-1000000000000"
      ADMIN_IDS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copies the repo's docker-compose.yml onto the VPS on every deploy,
      # so the file actually running there can never drift out of sync
      # with what's in the repo (e.g. a stale image name).
      - name: Sync docker-compose.yml to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.yml"
          target: "/opt/housemate"

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/housemate
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
